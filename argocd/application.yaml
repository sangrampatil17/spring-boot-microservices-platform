# GitOps: ArgoCD watches the k8s/ folder and keeps the cluster in sync with Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-microservices-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sangrampatil17/spring-boot-microservices-platform.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
