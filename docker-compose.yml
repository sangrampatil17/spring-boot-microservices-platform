services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/taskdb
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0123456789abcdef}
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["8081:8081"]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      TASK_SERVICE_URL: http://task-service:8081
    depends_on: [task-service]
    ports: ["8080:8080"]

volumes:
  mongo-data:
